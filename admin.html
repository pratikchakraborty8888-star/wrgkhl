<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Store | Admin Order Search</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="padding: 40px 20px;">
    
    <div class="container">
        <div class="cyber-box checkout-box" style="max-width: 600px; margin: 0 auto; text-align: center; border-color: var(--neon-purple);">
            <h1 style="color: var(--neon-purple); margin-bottom: 10px; font-size: 28px;">Admin Terminal</h1>
            <p style="color: #d1c4e9; margin-bottom: 25px; font-size: 14px;">Search and manage customer transactions</p>

            <!-- Original Order ID Search Bar -->
            <div style="display: flex; gap: 10px; margin-bottom: 30px;">
                <input type="text" id="searchOrderId" class="cyber-input" placeholder="Enter Order ID (e.g., #ORDER123456)" style="margin-bottom: 0; text-transform: uppercase;">
                <button id="searchOrderBtn" class="cyber-btn" style="width: auto; padding: 0 25px;">Search</button>
            </div>

            <!-- Search Results Display -->
            <div id="orderResultContainer" style="display: none; text-align: left; background: rgba(5,2,10,0.6); padding: 20px; border-radius: 8px; border: 1px solid rgba(176,38,255,0.3);">
                <!-- Fetched order data will appear here -->
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="admin.js"></script>
</body>
</html>
